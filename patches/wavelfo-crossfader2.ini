# Draw an LFO waveform on eight motor faders (crossfader2 demo, issue #78).
# O1: [WAVE] drawn LFO, curve per B3.1
# O2: [LIN] same faders, plain linear crossfader for A/B
# O3: [PHASE] the sawtooth sweeping the faders
# P3.1: [RATE] 0.1 .. 10 Hz
# P3.2: [LEVEL] output level
# B3.1: [CURVE] press to cycle: linear, cubic, fourier
# B3.2: [BIPOL] on = -10..+10 V, off = 0..10 V
# B3.3: [LOOP] on = ring (seamless), off = crossfader's N-1 segments (both outs)
#
# EXPERIMENTAL - vcvoid only. crossfader2 is not a DROID circuit; this patch
# will NOT run on hardware, and vcvoid refuses to load it until "Allow
# experimental circuits" is enabled in the master module's context menu.
# Validate with:  tools/droidcheck/build/droidcheck --experimental <this file>
#
# Chain: [m4][m4][p2b8] -- two M4s for the eight faders, one P2B8 for rate,
# level and the three toggles. Nothing else is needed; on a bigger rack put
# these three first or renumber P3/B3/L3 to the P2B8's controller number.
#
# The eight faders ARE the waveform: fader 1 is the value at the start of the
# cycle, fader 8 the value seven eighths through, and with LOOP on the curve
# runs from fader 8 back to fader 1 to close the cycle. With LOOP off the
# cycle is fader 1 to fader 8 in seven equal steps followed by a jump back,
# which is what a plain crossfader does; both outputs switch together. Compare O1 with O2 on
# a scope: O2 has a corner at every fader; O1 passes through the same eight
# values but between them follows the curve B3.1 selects. Cubic (1) stays
# inside the faders' range; fourier (2) overshoots and rings, which is what
# makes it look drawn rather than connected.

[m4]
[m4]
[p2b8]

[faderbank]
    firstfader = 1
    output1 = _W1
    output2 = _W2
    output3 = _W3
    output4 = _W4
    output5 = _W5
    output6 = _W6
    output7 = _W7
    output8 = _W8

[lfo]
    hz = P3.1 * 9.9 + 0.1
    sawtooth = _PHASE

# three states: 0 linear (LED off), 1 cubic (dim), 2 fourier (bright)
[button]
    button = B3.1
    led = L3.1
    states = 3
    output = _CURVE

[button]
    button = B3.2
    led = L3.2
    onvalue = 2
    offvalue = 1
    output = _GAIN

[button]
    button = B3.3
    led = L3.3
    output = _LOOP

# The plain crossfader on O2 has no loop input: with 8 inputs its fade 0..1
# spans 7 segments and jumps from fader 8 back to fader 1. Scaling fade by
# 8/7 closes the ring. Follow the LOOP button so O1 and O2 always agree:
# _SCALE = 8/7 with LOOP on, 1 with LOOP off.
[copy]
    input = _LOOP * 0.142857 + 1
    output = _SCALE

# unipolar: gain 1, shift 0.  bipolar: gain 2, shift -1
[copy]
    input = _GAIN * -1 + 1
    output = _SHIFT

[crossfader2]
    input1 = _W1
    input2 = _W2
    input3 = _W3
    input4 = _W4
    input5 = _W5
    input6 = _W6
    input7 = _W7
    input8 = _W8
    fade   = _PHASE
    curve  = _CURVE
    loop   = _LOOP
    output = _WAVE

# the hardware-compatible reference: plain crossfader, ring closed via _SCALE
[crossfader]
    input1 = _W1
    input2 = _W2
    input3 = _W3
    input4 = _W4
    input5 = _W5
    input6 = _W6
    input7 = _W7
    input8 = _W8
    fade   = _PHASE * _SCALE
    output = _LIN

[copy]
    input = _WAVE * _GAIN + _SHIFT
    output = _OUT

[copy]
    input = _OUT * P3.2
    output = O1

[copy]
    input = _LIN * P3.2
    output = O2

[copy]
    input = _PHASE
    output = O3
