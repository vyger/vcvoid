# Draw an LFO waveform on eight motor faders (crossfader2 demo, issue #78).
# O1: [WAVE] drawn LFO, cubic/linear per B9.1
# O2: [LIN] same faders, plain linear crossfader for A/B
# O3: [PHASE] the sawtooth sweeping the faders
# P9.1: [RATE] 0.1 .. 10 Hz
# P9.2: [LEVEL] output level
# B9.1: [CURVE] on = cubic (smooth), off = linear
# B9.2: [BIPOL] on = -10..+10 V, off = 0..10 V
# B9.3: [LOOP] on = ring (seamless), off = crossfader's N-1 segments
#
# EXPERIMENTAL - vcvoid only. crossfader2 is not a DROID circuit; this patch
# will NOT run on hardware, and vcvoid refuses to load it until "Allow
# experimental circuits" is enabled in the master module's context menu.
# Validate with:  tools/droidcheck/build/droidcheck --experimental <this file>
#
# Chain (Chris's rack): MASTER18 | X7 | G8 | DB8E | E4 | E4 | M4 | M4 | M4 |
# B32 | B32 | P2B8. X7 and G8 do not count for controller numbers, so the
# faders 1..8 are on M4 #4 and #5 and the P2B8 is controller 9.
#
# The eight faders ARE the waveform: fader 1 is the value at the start of the
# cycle, fader 8 the value seven eighths through, and with LOOP on the curve
# runs from fader 8 back to fader 1 to close the cycle. Compare O1 with O2 on
# a scope: O2 has a corner at every fader, O1 with CURVE on does not, and
# both pass through exactly the same eight values.

[db8e]
[e4]
[e4]
[m4]
[m4]
[m4]
[b32]
[b32]
[p2b8]

[faderbank]
    firstfader = 1
    output1 = _W1
    output2 = _W2
    output3 = _W3
    output4 = _W4
    output5 = _W5
    output6 = _W6
    output7 = _W7
    output8 = _W8

[lfo]
    hz = P9.1 * 9.9 + 0.1
    sawtooth = _PHASE

[button]
    button = B9.1
    led = L9.1
    output = _CURVE

[button]
    button = B9.2
    led = L9.2
    onvalue = 2
    offvalue = 1
    output = _GAIN

[button]
    button = B9.3
    led = L9.3
    output = _LOOP

# unipolar: gain 1, shift 0.  bipolar: gain 2, shift -1
[copy]
    input = _GAIN * -1 + 1
    output = _SHIFT

[crossfader2]
    input1 = _W1
    input2 = _W2
    input3 = _W3
    input4 = _W4
    input5 = _W5
    input6 = _W6
    input7 = _W7
    input8 = _W8
    fade   = _PHASE
    curve  = _CURVE
    loop   = _LOOP
    output = _WAVE

# the hardware-compatible reference: plain crossfader, closed with the 8/7 trick
[crossfader]
    input1 = _W1
    input2 = _W2
    input3 = _W3
    input4 = _W4
    input5 = _W5
    input6 = _W6
    input7 = _W7
    input8 = _W8
    fade   = _PHASE * 1.142857
    output = _LIN

[copy]
    input = _WAVE * _GAIN + _SHIFT
    output = _OUT

[copy]
    input = _OUT * P9.2
    output = O1

[copy]
    input = _LIN * P9.2
    output = O2

[copy]
    input = _PHASE
    output = O3
