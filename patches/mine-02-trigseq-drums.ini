# mine-02-trigseq-drums
#
# EXPERIMENTAL — this patch uses `trigseq`, which exists only in vcvoid and
# will NOT run on DROID hardware. Enable "Allow experimental circuits" in the
# master's context menu to load it. Validate with:
#     tools/droidcheck/build/droidcheck --experimental patches/mine-02-trigseq-drums.ini
#
# A self-running three-voice drum pattern written as text, plus a two-bar
# chained phrase, all off one clock.
# Circuits used: lfo, trigseq
#
# The whole rhythm is legible in the patch file — which is the point of
# trigseq. Rests are '.', triggers are anything else (here 'x' and 'o').
#
# The O1..O5 lines below are register labels: the Forge and vcvoid both show
# them on the jacks. They only count in the patch header, so this file must NOT
# open with a "# ----" separator — that would make them section prose.
#
#   O1: [CLK] master clock, 8 Hz square = 120 BPM at 16th notes
#   O2: [KICK] four on the floor
#   O3: [SNARE] backbeat, from the SAME pattern as the kick's offbeats
#   O4: [HATS] every step the kick does not play
#   O5: [BASS] a 2-bar chained phrase, held for the whole step

[lfo]
    hz     = 8        # 8 Hz -> 120 BPM in 16th notes (BPM = hz * 15)
    square = O1

# Kick: an 8-step pattern, played twice per bar. A full 16-step bar would fit
# in one text (the format allows 18 characters), but two bars of 8 read better
# and chain just as well.
[trigseq]
    clock    = O1     # read the master clock back from output O1
    pattern  = "x...x..."
    output   = O2
    offbeats = O4     # hats fill every gap — no second pattern needed

[trigseq]
    clock    = O1
    pattern  = "....x..."     # backbeat
    output   = O3

# A two-bar bass phrase, chained: 8 + 8 = 16 steps. Only this first circuit
# declares the clock and the output; the second just supplies its pattern.
# outputsignal = 1 makes each hit a gate that lasts the whole step rather than
# a copy of the clock pulse — useful for an envelope's gate input.
[trigseq]
    clock        = O1
    pattern      = "x..x..x."
    outputsignal = 1
    chaintonext  = 1
    output       = O5

[trigseq]
    pattern      = "x..x.x.."
