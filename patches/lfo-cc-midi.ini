# Eight free-running LFOs -> USB MIDI, channel 1, as 14-bit
# CCs: MSB on CC22..29, LSB on CC54..61 (the standard n / n+32
# pairing). Also mirrored to the CV outputs O1..O8.
#
# Chain: MASTER18 + DB8E. The MASTER18's own USB-C port carries
# the MIDI (usb = 1); the DB8E encoder sets the CC update rate
# and shows it on the display.
#
# Each LFO runs at its own rate (Fibonacci-ish Hz, so the eight
# modulations never line up) and outputs a unipolar sine
# (0.0 .. 1.0).
#
# 14-bit split, per LFO n:
#   _Tn   = round(_Mn * 16383)      full 14-bit value 0..16383
#   _Qn   = _Tn / 128               (fractional)
#   _MSBn = floor(_Qn)              coarse byte 0..127
#   _Ln   = _Tn modulo 128          fine byte   0..127
# midiout's cc inputs are 0..1 mapped to 0..127, so each byte
# is scaled back with "/ 127".
#
# WIRE ORDER MATTERS. CCs are emitted in slot order within a
# circuit, and circuits in patch order. Each output's LSB and
# MSB are therefore placed in adjacent slots of the SAME
# circuit, giving L1 M1 L2 M2 ... on the wire: receivers that
# keep a single pending-LSB latch (rather than one per CC)
# need the pair adjacent. Four outputs fill one circuit's
# eight cc slots, hence two midiout circuits.
#
# Target: Expert Sleepers NTX-8CV, Direct Levels mapped to
# CC22..29 on channel 1, "14 bit CC byte order" = LSB first,
# output ranges -10V..+10V.
#
# Map:  LFO n -> CC(21+n) MSB / CC(53+n) LSB / On CV / rate:
#       0.05  0.08  0.13  0.21  0.34  0.55  0.89  1.44 Hz

[db8e]

# --- CC update rate, on the DB8E encoder ---------------------

# The staircase on the receiving CV is set by this rate, not by
# the bit depth. The DROID's patch loop runs at ~5.5 kHz, so a
# square wave tops out at ~2750 triggers/s, which is the
# ceiling and the encoder's maximum. Measured sweet spot with
# all eight LFOs running: ~500 Hz (24 kB/s of MIDI), which is
# smooth on an NTX-8CV without saturating. It starts at the
# ceiling; turn
# down to find what the MIDI path sustains: all eight LFOs
# push 16 CCs x 3 bytes per trigger (132 kB/s at 2750 Hz,
# against 3 kB/s for a single LFO in lfo-cc-midi-debug.ini).
#
# takeovercontrols hands the DB8E's encoder and buttons to the
# patch instead of the display's own browsing UI.

[display]
    takeovercontrols = 1

[encoder]
    encoder = E1.1
    startvalue = 1
    outputscale = 2650
    outputoffset = 100
    header = "CC RATE HZ"
    output = _RATE

[lfo]
    hz = _RATE
    square = _CCCLK

# --- the eight LFOs -----------------------------------------

[lfo]
    hz = 0.05
    bipolar = 0
    sine = _M1

[lfo]
    hz = 0.08
    bipolar = 0
    sine = _M2

[lfo]
    hz = 0.13
    bipolar = 0
    sine = _M3

[lfo]
    hz = 0.21
    bipolar = 0
    sine = _M4

[lfo]
    hz = 0.34
    bipolar = 0
    sine = _M5

[lfo]
    hz = 0.55
    bipolar = 0
    sine = _M6

[lfo]
    hz = 0.89
    bipolar = 0
    sine = _M7

[lfo]
    hz = 1.44
    bipolar = 0
    sine = _M8

# --- 14-bit split -------------------------------------------

[math]
    input1 = _M1 * 16383
    round = _T1

[math]
    input1 = _T1
    input2 = 128
    quotient = _Q1
    modulo = _L1

[math]
    input1 = _Q1
    floor = _MSB1

[math]
    input1 = _M2 * 16383
    round = _T2

[math]
    input1 = _T2
    input2 = 128
    quotient = _Q2
    modulo = _L2

[math]
    input1 = _Q2
    floor = _MSB2

[math]
    input1 = _M3 * 16383
    round = _T3

[math]
    input1 = _T3
    input2 = 128
    quotient = _Q3
    modulo = _L3

[math]
    input1 = _Q3
    floor = _MSB3

[math]
    input1 = _M4 * 16383
    round = _T4

[math]
    input1 = _T4
    input2 = 128
    quotient = _Q4
    modulo = _L4

[math]
    input1 = _Q4
    floor = _MSB4

[math]
    input1 = _M5 * 16383
    round = _T5

[math]
    input1 = _T5
    input2 = 128
    quotient = _Q5
    modulo = _L5

[math]
    input1 = _Q5
    floor = _MSB5

[math]
    input1 = _M6 * 16383
    round = _T6

[math]
    input1 = _T6
    input2 = 128
    quotient = _Q6
    modulo = _L6

[math]
    input1 = _Q6
    floor = _MSB6

[math]
    input1 = _M7 * 16383
    round = _T7

[math]
    input1 = _T7
    input2 = 128
    quotient = _Q7
    modulo = _L7

[math]
    input1 = _Q7
    floor = _MSB7

[math]
    input1 = _M8 * 16383
    round = _T8

[math]
    input1 = _T8
    input2 = 128
    quotient = _Q8
    modulo = _L8

[math]
    input1 = _Q8
    floor = _MSB8

# --- MIDI: outputs 1-4, LSB+MSB pairs interleaved -------

[midiout]
    usb = 1
    channel = 1
    ccnumber1 = 54
    cc1 = _L1 / 127
    cctrigger1 = _CCCLK
    ccnumber2 = 22
    cc2 = _MSB1 / 127
    cctrigger2 = _CCCLK
    ccnumber3 = 55
    cc3 = _L2 / 127
    cctrigger3 = _CCCLK
    ccnumber4 = 23
    cc4 = _MSB2 / 127
    cctrigger4 = _CCCLK
    ccnumber5 = 56
    cc5 = _L3 / 127
    cctrigger5 = _CCCLK
    ccnumber6 = 24
    cc6 = _MSB3 / 127
    cctrigger6 = _CCCLK
    ccnumber7 = 57
    cc7 = _L4 / 127
    cctrigger7 = _CCCLK
    ccnumber8 = 25
    cc8 = _MSB4 / 127
    cctrigger8 = _CCCLK

# --- MIDI: outputs 5-8, LSB+MSB pairs interleaved -------

[midiout]
    usb = 1
    channel = 1
    ccnumber1 = 58
    cc1 = _L5 / 127
    cctrigger1 = _CCCLK
    ccnumber2 = 26
    cc2 = _MSB5 / 127
    cctrigger2 = _CCCLK
    ccnumber3 = 59
    cc3 = _L6 / 127
    cctrigger3 = _CCCLK
    ccnumber4 = 27
    cc4 = _MSB6 / 127
    cctrigger4 = _CCCLK
    ccnumber5 = 60
    cc5 = _L7 / 127
    cctrigger5 = _CCCLK
    ccnumber6 = 28
    cc6 = _MSB7 / 127
    cctrigger6 = _CCCLK
    ccnumber7 = 61
    cc7 = _L8 / 127
    cctrigger7 = _CCCLK
    ccnumber8 = 29
    cc8 = _MSB8 / 127
    cctrigger8 = _CCCLK

# --- CV mirror on O1..O8 ------------------------------------

# Scaled to match the NTX-8CV's -10V..+10V output range: the
# unipolar 0..1 LFO becomes -1..+1, so each O jack shows what
# the corresponding NTX-8CV output should be doing.

[copy]
    input = _M1 * 2 - 1
    output = O1

[copy]
    input = _M2 * 2 - 1
    output = O2

[copy]
    input = _M3 * 2 - 1
    output = O3

[copy]
    input = _M4 * 2 - 1
    output = O4

[copy]
    input = _M5 * 2 - 1
    output = O5

[copy]
    input = _M6 * 2 - 1
    output = O6

[copy]
    input = _M7 * 2 - 1
    output = O7

[copy]
    input = _M8 * 2 - 1
    output = O8
