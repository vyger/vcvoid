# UAT warning patch: loads SUCCESSFULLY but with a warning.
#
# Used by tools/uatbridge-smoke.sh to assert the `warnings` class of
# GET /master/{id}/diagnostics (issue #46): a patch that runs, but that the
# user should be told something about. A deprecated circuit is the only warning
# a default master can reach from the bridge — the other two warning sources
# (the RAM budget and the 64 000-byte size gate) only warn instead of erroring
# when the module's "ignore hardware memory limits" option is on, and that has
# no bridge route.
#
# `togglebutton` is deprecated in blue-7 (superseded by `button`), which is why
# it is here — and it is also why droidcheck/the Forge reports a problem for
# THIS patch: "This circuit is deprecated". That is the one recorded, accepted
# divergence between us and the Forge (we still emulate the obsolete circuits,
# because the hardware still runs them — see tools/crosscheck.sh, which encodes
# exactly this exception). Do not "fix" it by swapping in `button`: the
# deprecation warning IS the fixture.
#
# Rack setup: [master | p2b8]. Expect: statusLine "ok, N bytes RAM — 1
# warning(s)", diagnostics state "warnings", severity "warning".
[p2b8]

[togglebutton]
    button = B1.1
    led = L1.1
    output = O1
