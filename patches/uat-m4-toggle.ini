# UAT fixture: the motor-fader TOGGLE TRICK (issue #45).
#
# `button = _T` + `clear = _T` on one notched fader, with `startvalue` wired to
# the INVERSE of the fader's own output, turns the touch plate into a toggle —
# the shape the Forge's MFPS generator uses for its clock mute. The bug this
# guards: the recall used to survive exactly one tick and then be overwritten by
# the fader's own (unmoved) physical position, because a finger on the plate
# counts as holding the fader.
#
# Chain: declared [e4][m4] so the patch matches the physical UAT row
# master|e4|m4|db8e (the E4 is a position placeholder, it has no faders, so
# `fader = 1` is M4 fader 1; the DB8E is surplus/idle).
#
# Drive: press the M4's plate 1 (paramId 4) and RELEASE it. Expect the fader's
# motorTarget (GET /master/{id}/faders) and O1 to be at the other dent and STAY
# there after release — end state only, the trajectory is not asserted.
# Boot value is dent 1 (startvalue = -1 * 0 + 1); one press toggles to dent 0.
[e4]

[m4]

[motorfader]
    fader = 1
    notches = 2
    output = _V
    button = _T
    clear = _T
    startvalue = -1 * _V + 1

[copy]
    input = _V
    output = O1
