# UAT: the DB8E custom display layouts (issue #22, Group C).
#
# Chain: Master | P2B8 | DB8E. The P2B8 is controller 1, the DB8E controller 2.
#
# What to look for:
#
#  - BUTTON BUBBLES. Press B1.1 (the P2B8's top-left button). The OLED shows
#    the header "MODE" over a chain of FOUR small bubbles joined by short
#    horizontal lines, with exactly one filled solid. Each press moves the
#    filled bubble one step right and then wraps back to the first. The
#    button's own LED (L1.1) dims through four brightness levels in step.
#    Nothing shows on the screen until you press it the first time.
#
#  - RECORDER WORDS. Press B1.2 (record): the screen reads "Recording" with no
#    header. B1.3 (play) reads "Playback", B1.4 (stop) reads "Bypass". Each
#    word appears on the mode CHANGE and then stays until the next one. Feed a
#    moving CV into I1 first if you want the playback to have something to
#    play; the mode words do not depend on it.
#
#  - They share one screen, so whichever you touch last owns it. Neither holds
#    the screen against the other: pressing B1.1 right after B1.2 switches
#    straight back to the bubbles.

[p2b8]

[db8e]

[button]
    button = B1.1
    led    = L1.1
    output = _MODE
    states = 4

[copy]
    input  = _MODE
    output = O1

[recorder]
    recordbutton = B1.2
    playbutton   = B1.3
    stopbutton   = B1.4
    recordled    = L1.2
    playled      = L1.3
    stopled      = L1.4
    cvin         = I1
    cvout        = O2
