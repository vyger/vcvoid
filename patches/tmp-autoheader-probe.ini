# LABELS: master=18

# TEMPORARY probe patch — auto-header capture for issue #19.
# Delete once the DB8E header strings are pinned down.
#
# Every circuit here deliberately OMITS `header`, so the DB8E
# shows the automatic title the firmware derives itself. The
# manual only says it is "an automatic title ... for example if
# the output of this circuit is fed into an internal patch
# cable, the name of this cable is displayed" (encoder.md,
# pot.md, motorfader.md, ...) and shows "Output O1" for a
# register in the hardware chapter. That is not enough to
# reimplement: we need the exact strings.
#
# CASES 1-6 ARE ANSWERED (measured on hardware 2026-08-02):
#   1. register target -> "Output O1"
#   2. cable target    -> "CUTOFF" (leading underscore dropped)
#   3. long cable name -> cut hard at 17 chars, no ellipsis:
#      _FILTER_RESONANCE_AMOUNT -> "FILTER_RESONANCE_"
#   4. explicit header -> wins, as expected
#   5. no output jack  -> no header at all, just the value
#
# STILL TO CAPTURE: cases 7-10 below (motorfader with a cable
# target and with a register target, button, buttongroup) —
# each of those circuits has its own rule for WHEN it writes,
# and only the header derivation is confirmed so far.
#
# Chain (X7 and G8 are not declared; they take no controller
# numbers): DB8E=1, E4=2, E4=3, M4=4,5,6, B32=7,8, P2B8=9.
# There is deliberately NO [display] circuit and no
# takeovercontrols, so the DB8E keeps its own buttons: use
# button 1 (NUM) and 6 (magnifier) to check number formats too.

[db8e]
[e4]
[e4]
[m4]
[m4]
[m4]
[b32]
[b32]
[p2b8]

# --- 1. register target: pot -> O1 ---------------------------
# Expected (hardware.md's pot example): "Output O1".

[pot]
    pot = P9.1
    output = O1

# --- 2. cable target: pot -> _CUTOFF -------------------------
# The leading underscore is part of the cable's real name.

[pot]
    pot = P9.2
    output = _CUTOFF

# --- 3. register target: encoder -> O2 -----------------------

[encoder]
    encoder = E2.1
    output = O2

# --- 4. long cable name: does it truncate? -------------------

[encoder]
    encoder = E2.2
    output = _FILTER_RESONANCE_AMOUNT

# --- 5. explicit header still wins ---------------------------

[encoder]
    encoder = E2.3
    header = "MY OWN TITLE"
    output = _DECAY

# --- 6. no output jack at all --------------------------------
# Nothing to derive a name from. Blank header, or something
# generic like the circuit name?

[encoder]
    encoder = E2.4

# --- 7. motorfader, cable target -----------------------------

[motorfader]
    fader = 1
    output = _ATTACK

# --- 8. motorfader, register target --------------------------

[motorfader]
    fader = 2
    output = O3

# --- 9. button, cable target ---------------------------------

[button]
    button = B7.1
    output = _GATE

# --- 10. buttongroup: shows only when maxactive = 1 ----------
# and `output` is used (buttongroup.md). Both hold here, so it
# SHOULD show a value; worth confirming it does.

[buttongroup]
    button1 = B9.1
    button2 = B9.2
    button3 = B9.3
    maxactive = 1
    output = _SELECT

# --- cable sink ----------------------------------------------
# Every internal cable needs at least one reader or the patch
# will not load. Nothing here is meant to be listened to.

[mixer]
    input1 = _CUTOFF
    input2 = _FILTER_RESONANCE_AMOUNT
    input3 = _DECAY
    input4 = _ATTACK
    input5 = _GATE
    input6 = _SELECT
    output = O4
