# LABELS: master=18
# UAT: encoquencer on the DB8E (issue #22, Group C).
#
# Chain: MASTER18 | DB8E | E4 | M4 | M4 | B32. The M4s are only there so the
# chain matches the hardware probe this patch was measured with; nothing uses
# them. The E4's four encoders are the sequencer's four steps: the DB8E's own
# encoder is NOT a step (encoquencer.md: DB8Es "are simply ignored").
#
# Two encoquencers share the E4. All controls are on the B32 (LEDs show the
# current choice):
#   B5.25 / B5.26  SEQ A (default titles) / SEQ B (cvname "Melody",
#                  gatename "Accent")
#   B5.1-B5.8      what TURNING an encoder edits: pitch, randomize, gate prob,
#                  repeats, gate pattern, ratchets, gate, skip
#   B5.9-B5.12     what PUSHING an encoder does: gates, start/end,
#                  gate pattern, skip
#   B5.17-B5.19    quantize 0 / 1 / 2 (2 lit at start)
#
# What to look for — every turn or push shows the edit (hardware-measured):
#   pitch, quantize 2/1  "Pitch" (SEQ B: "Melody") over a note with octave, C2
#   pitch, quantize 0    "Output O1" (SEQ B: "Melody") over 0.00-1.00
#   randomize            "Randomize" over 0-7
#   gate probability     "Probability" over e.g. 50%
#   repeats / ratchets   "Repeats" / "Ratchets" over the count
#   gate pattern         four squares, first filled / four filled / one long
#                        bar / the words "tie to next"
#   gate                 "Gate" over play/silent (SEQ B: "Accent", on/off)
#   skip                 "Skip" over skip/play
#   push, start/end      "Playing range" over 1-2 (pushing encoder 2)

[db8e]
[e4]
[m4]
[m4]
[b32]

[lfo]
    hz = 2
    square = _CLK

[buttongroup]
    button1 = B5.1
    button2 = B5.2
    button3 = B5.3
    button4 = B5.4
    button5 = B5.5
    button6 = B5.6
    button7 = B5.7
    button8 = B5.8
    led1 = L5.1
    led2 = L5.2
    led3 = L5.3
    led4 = L5.4
    led5 = L5.5
    led6 = L5.6
    led7 = L5.7
    led8 = L5.8
    output = _FM

[buttongroup]
    button1 = B5.9
    button2 = B5.10
    button3 = B5.11
    button4 = B5.12
    led1 = L5.9
    led2 = L5.10
    led3 = L5.11
    led4 = L5.12
    output = _BM

[buttongroup]
    button1 = B5.17
    button2 = B5.18
    button3 = B5.19
    led1 = L5.17
    led2 = L5.18
    led3 = L5.19
    startbutton = 3
    output = _Q

[buttongroup]
    button1 = B5.25
    button2 = B5.26
    led1 = L5.25
    led2 = L5.26
    output = _SEQ

[encoquencer]
    select = _SEQ
    selectat = 0
    clock = _CLK
    quantize = _Q
    fadermode = _FM
    buttonmode = _BM
    cv = O1
    gate = O2

[encoquencer]
    select = _SEQ
    selectat = 1
    clock = _CLK
    quantize = _Q
    fadermode = _FM
    buttonmode = _BM
    cvname = "Melody"
    gatename = "Accent"
    cv = O3
    gate = O4
