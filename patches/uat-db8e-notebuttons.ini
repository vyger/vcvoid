# UAT: notebuttons on the DB8E (issue #22, Group C).
#
# Chain: Master | B32 | DB8E. The B32 is controller 1, the DB8E controller 2.
#
# What to look for:
#
#  - NOTE NAMES. B32 buttons 1-12 (B1.1-B1.12, as numbered on the faceplate)
#    are a 12-key keyboard, C to B. Press one: the OLED shows the header
#    "ROOT" over the note name (C, C#, D, ... B), and that button's LED
#    lights. Sharps are drawn as '#'. There is NO octave digit: notebuttons
#    picks a note, not a pitch. Nothing shows on the screen until you press a
#    key the first time.
#
#  - TITLE FALLBACK. Buttons 17-28 (B1.17-B1.28) are a second keyboard whose
#    circuit patches only `semitone`, not `output`. Its notes show under
#    "Output O2" — the manual's fallback title.
#
#  - The two share one screen, so whichever you press last owns it.

[b32]

[db8e]

[notebuttons]
    button1 = B1.1
    button2 = B1.2
    button3 = B1.3
    button4 = B1.4
    button5 = B1.5
    button6 = B1.6
    button7 = B1.7
    button8 = B1.8
    button9 = B1.9
    button10 = B1.10
    button11 = B1.11
    button12 = B1.12
    led1 = L1.1
    led2 = L1.2
    led3 = L1.3
    led4 = L1.4
    led5 = L1.5
    led6 = L1.6
    led7 = L1.7
    led8 = L1.8
    led9 = L1.9
    led10 = L1.10
    led11 = L1.11
    led12 = L1.12
    output    = _ROOT
    semitone  = O1

[copy]
    input  = _ROOT
    output = O3

[notebuttons]
    button1 = B1.17
    button2 = B1.18
    button3 = B1.19
    button4 = B1.20
    button5 = B1.21
    button6 = B1.22
    button7 = B1.23
    button8 = B1.24
    button9 = B1.25
    button10 = B1.26
    button11 = B1.27
    button12 = B1.28
    led1 = L1.17
    led2 = L1.18
    led3 = L1.19
    led4 = L1.20
    led5 = L1.21
    led6 = L1.22
    led7 = L1.23
    led8 = L1.24
    led9 = L1.25
    led10 = L1.26
    led11 = L1.27
    led12 = L1.28
    semitone  = O2
