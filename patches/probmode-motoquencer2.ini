# Narrow the gate-probability fader to one family of settings (motoquencer2 demo, issue #85).
# O1: [CV] the sequencer's pitch
# O2: [GATE] the sequencer's gate
# O3: [CLK] the internal clock, for scoping
# P2.1: [RATE] 1 .. 10 Hz
# B2.1: [PMODE] press to cycle: all eight notches, random only, trig only
# B2.2: [LANE] off = pitch fader, on = gate-probability fader
#
# EXPERIMENTAL - vcvoid only. motoquencer2 is not a DROID circuit; this patch
# will NOT run on hardware, and vcvoid refuses to load it until "Allow
# experimental circuits" is enabled in the master module's context menu.
# Validate with:  tools/droidcheck/build/droidcheck --experimental <this file>
#
# Chain: [m4][p2b8] -- one M4 for the four step faders, one P2B8 for the rate
# pot and the two buttons. On a bigger rack put these two first or renumber
# P2/B2/L2 to the P2B8's controller number.
#
# Hold LANE on to put the four faders on the gate-probability lane, then cycle
# PMODE and feel the dents change:
#   LED off    all eight notches, exactly what [motoquencer] gives you
#   LED dim    five notches: always / 50% / 25% / 12% / conditional
#   LED bright four notches: always / every even turn / every odd turn / every 4th
# The sequence is four steps, so a "turn" is four clocks. Dial step 1 to "every
# odd turn" in the trig mode (the second dent from the bottom), then switch to
# the random mode: the step keeps playing on every other turn, and its fader
# just parks on the nearest dent it has there (25%). Switch back and the fader
# returns to where you left it. Only actually moving a fader changes a step.

[m4]
[p2b8]

[lfo]
    hz = P2.1 * 9 + 1
    square = _CLK

# three states: 0 all notches (LED off), 1 random only (dim), 2 trig only (bright)
[button]
    button = B2.1
    led = L2.1
    states = 3
    output = _PMODE

# fadermode 0 = pitch, 2 = gate probability
[button]
    button = B2.2
    led = L2.2
    onvalue = 2
    offvalue = 0
    output = _FMODE

[motoquencer2]
    clock = _CLK
    numfaders = 4
    numsteps = 4
    fadermode = _FMODE
    probabilitymode = _PMODE
    cv = O1
    gate = O2

[copy]
    input = _CLK
    output = O3
