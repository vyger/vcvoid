# UAT fixture: motoquencer's interactive START/END gesture (buttonmode = 1).
#
# manual/circuits/motoquencer.md §"Start and end": with `buttonmode = 1`,
# touching a step button sets the END step; holding that button and pressing a
# second one sets the START step. So the four-part gesture
#
#     press plate A -> press plate B -> release A -> release B
#
# must leave end = A and start = B. `startstepout` / `endstepout` are published
# to internal cables so the bridge can read them back without burning an output
# jack (they are 1-based step NUMBERS, not voltages).
#
# O3/O4 mirror them for a human watching the panel, scaled x0.1 the way
# tests/golden/motoquencer/startend-*.gold does: an O register clamps to
# +/-10 V (= +/-1.0), so an unscaled step 3 would read back as 1. The runner
# reads the CABLES, where the number is un-clamped.
#
# Chain: declared [e4][m4] to match the physical UAT row master|e4|m4|db8e (the
# E4 has no faders, so `firstfader = 1` is M4 fader 1; the DB8E is idle). One
# page: 4 faders, 4 steps — so the defaults are start 1 / end 4, and the
# gesture the runner performs (plate 3, then plate 2) moves both.
[e4]

[m4]

[lfo]
    hz = 4
    square = _CLK

[motoquencer]
    clock = _CLK
    firstfader = 1
    numfaders = 4
    numsteps = 4
    buttonmode = 1
    startstepout = _SS
    endstepout = _ES
    cv = O1
    gate = O2

[copy]
    input = _SS * 0.1
    output = O3

[copy]
    input = _ES * 0.1
    output = O4
