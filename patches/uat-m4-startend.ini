# UAT fixture: motoquencer's interactive START/END gesture (buttonmode = 1).
#
# manual/circuits/motoquencer.md §"Start and end": with `buttonmode = 1`,
# touching a step button sets the END step; holding that button and pressing a
# second one sets the START step. So the four-part gesture
#
#     press plate A -> press plate B -> release A -> release B
#
# must leave end = A and start = B. `startstepout` / `endstepout` are published
# to internal cables so the bridge can read them back without burning an output
# jack (they are integers — a step NUMBER, not a voltage).
#
# Chain: declared [e4][m4] to match the physical UAT row master|e4|m4|db8e (the
# E4 has no faders, so `firstfader = 1` is M4 fader 1; the DB8E is idle). One
# page: 4 faders, 4 steps.
#
# Engine support for the gesture is issue #48 — until that lands, the runner
# step built on this fixture is expected to fail.
[e4]

[m4]

[lfo]
    hz = 4
    square = _CLK

[motoquencer]
    clock = _CLK
    firstfader = 1
    numfaders = 4
    numsteps = 4
    buttonmode = 1
    startstepout = _SS
    endstepout = _ES
    cv = O1
    gate = O2

[copy]
    input = _SS
    output = O3

[copy]
    input = _ES
    output = O4
