# Eight free-running LFOs -> USB MIDI, channel 1, as 14-bit CCs:
# coarse on CC22..29, fine on CC54..61. Also mirrored to the CV
# outputs O1..O8. Same job as lfo-cc-midi.ini, written with the
# experimental midihirescc circuit.
#
# EXPERIMENTAL — vcvoid only. midihirescc is not a DROID circuit;
# this patch will NOT run on hardware, and vcvoid refuses to load
# it until "Allow experimental circuits" is enabled in the master
# module's context menu. Validate with:
#     tools/droidcheck/build/droidcheck --experimental <this file>
# The hardware-runnable version is lfo-cc-midi.ini. Keep both: that
# one still works on a real DROID, this one never will.
#
# Measured against lfo-cc-midi.ini: 145 lines instead of 321, and
# 3524 bytes of master RAM instead of 8864.
#
# What the circuit removes, compared with lfo-cc-midi.ini:
#   * 24 math circuits — the 14-bit split (round to 0..16383, then
#     divide and modulo by 128) happens inside the emitter;
#   * one of the two midiout circuits — a midiout has 8 CC slots and
#     a hi-res destination burns two of them, so eight destinations
#     needed two circuits with the slots hand-ordered to keep each
#     coarse/fine pair adjacent on the wire. Here a pair is emitted
#     from one update and cannot be interleaved at all;
#   * the DB8E, its display and its rate encoder — those existed to
#     tune a brute-force resend clock. midihirescc sends a
#     controller only when its 14-bit value changes, so there is
#     nothing to clock and no controller hardware needed.
#
# Chain: any master with USB MIDI (MASTER18's own USB-C port, or an
# X7). usb = 1 is the first USB port. There is no TRS option: at
# these rates the traffic does not fit through a DIN cable.
#
# Each LFO runs at its own rate (Fibonacci-ish Hz, so the eight
# modulations never line up) and outputs a unipolar sine (0.0..1.0),
# which midihirescc resolves to 0..16383.
#
# Target: Expert Sleepers NTX-8CV, Direct Levels mapped to CC22..29
# on channel 1, "14 bit CC byte order" = LSB first (the default
# here), output ranges -10V..+10V.
#
# Map:  LFO n -> CC(21+n) coarse / CC(53+n) fine / On CV / rate:
#       0.05  0.08  0.13  0.21  0.34  0.55  0.89  1.44 Hz

# --- the eight LFOs -----------------------------------------

[lfo]
    hz = 0.05
    bipolar = 0
    sine = _M1

[lfo]
    hz = 0.08
    bipolar = 0
    sine = _M2

[lfo]
    hz = 0.13
    bipolar = 0
    sine = _M3

[lfo]
    hz = 0.21
    bipolar = 0
    sine = _M4

[lfo]
    hz = 0.34
    bipolar = 0
    sine = _M5

[lfo]
    hz = 0.55
    bipolar = 0
    sine = _M6

[lfo]
    hz = 0.89
    bipolar = 0
    sine = _M7

[lfo]
    hz = 1.44
    bipolar = 0
    sine = _M8

# --- MIDI: all eight destinations, one circuit --------------

# updaterate is a ceiling, not a clock: each controller is sent
# only when its own 14-bit value moves, so the slow LFOs cost
# almost nothing while the fast ones stay smooth. 500/s is the
# measured sweet spot on an NTX-8CV; lower it if a receiver
# starts lagging.

[midihirescc]
    usb        = 1
    channel    = 1
    lsbfirst   = 1
    updaterate = 500
    hirescc22  = _M1
    hirescc23  = _M2
    hirescc24  = _M3
    hirescc25  = _M4
    hirescc26  = _M5
    hirescc27  = _M6
    hirescc28  = _M7
    hirescc29  = _M8

# --- CV mirror on O1..O8 ------------------------------------

# Scaled to match the NTX-8CV's -10V..+10V output range: the
# unipolar 0..1 LFO becomes -1..+1, so each O jack shows what
# the corresponding NTX-8CV output should be doing.

[copy]
    input = _M1 * 2 - 1
    output = O1

[copy]
    input = _M2 * 2 - 1
    output = O2

[copy]
    input = _M3 * 2 - 1
    output = O3

[copy]
    input = _M4 * 2 - 1
    output = O4

[copy]
    input = _M5 * 2 - 1
    output = O5

[copy]
    input = _M6 * 2 - 1
    output = O6

[copy]
    input = _M7 * 2 - 1
    output = O7

[copy]
    input = _M8 * 2 - 1
    output = O8
